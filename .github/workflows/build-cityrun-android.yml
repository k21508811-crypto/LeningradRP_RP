name: Build City Run Android Apps
on:
  workflow_dispatch:
  push:
    branches: [cityrun-android-launcher]
    paths:
      - 'cityrun-android-launcher/**'
      - '.github/workflows/build-cityrun-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cityrun-android-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build launcher and mobile game
        run: gradle :app:assembleDebug :game:assembleDebug
      - name: Verify both APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s game/build/outputs/apk/debug/game-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk game/build/outputs/apk/debug/game-debug.apk
      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: CityRun-Launcher-Android
          path: cityrun-android-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload mobile game APK
        uses: actions/upload-artifact@v4
        with:
          name: CityRun-Mobile-Test
          path: cityrun-android-launcher/game/build/outputs/apk/debug/game-debug.apk
          if-no-files-found: error
