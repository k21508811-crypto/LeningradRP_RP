name: Build Proverka Antivirus

on:
  workflow_dispatch:
  push:
    paths:
      - "proverka-antivirus/**"
      - ".github/workflows/build-proverka-antivirus.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r proverka-antivirus/requirements.txt

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ProverkaAntivirus proverka-antivirus/main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ProverkaAntivirus-Windows-x64
          path: dist/ProverkaAntivirus.exe
          if-no-files-found: error
