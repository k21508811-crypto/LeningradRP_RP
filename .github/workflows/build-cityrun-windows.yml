name: Build City Run for Windows

on:
  push:
    branches: [gta5-one-mission]
    paths:
      - "gta5-one-mission/**"
      - ".github/workflows/build-cityrun-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Godot and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz -DestinationPath templates

      - name: Install export templates
        shell: pwsh
        run: |
          $templateDir = "$env:APPDATA\Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item "templates\templates\*" $templateDir -Recurse -Force
          if (!(Test-Path (Join-Path $templateDir "windows_release_x86_64.exe"))) {
            Get-ChildItem $templateDir -Recurse | Select-Object FullName
            throw "Godot Windows release export template was not installed"
          }

      - name: Import and validate project
        shell: pwsh
        run: |
          & "godot\Godot_v4.3-stable_win64.exe" --headless --editor --path "gta5-one-mission" --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows game
        shell: pwsh
        run: |
          $projectDir = Join-Path $PWD "gta5-one-mission"
          $buildDir = Join-Path $projectDir "build"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          & "godot\Godot_v4.3-stable_win64.exe" --headless --path $projectDir --export-release "Windows Desktop" "build/CityRun.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Files produced by Godot export:"
          Get-ChildItem -Path $projectDir -Recurse -File | Where-Object { $_.Extension -in ".exe", ".pck" } | Select-Object FullName,Length
          $expectedExe = Join-Path $buildDir "CityRun.exe"
          if (!(Test-Path $expectedExe)) {
            $foundExe = Get-ChildItem -Path $projectDir -Recurse -Filter "*.exe" -File | Select-Object -First 1
            if ($null -ne $foundExe) {
              Copy-Item $foundExe.FullName $expectedExe -Force
              Write-Host "Copied exported executable from $($foundExe.FullName)"
            } else {
              throw "Godot reported export success but no Windows executable was produced"
            }
          }
          if (!(Test-Path $expectedExe)) { throw "Expected executable missing after export: $expectedExe" }

      - name: Package game
        shell: pwsh
        run: |
          $projectDir = Join-Path $PWD "gta5-one-mission"
          $buildDir = Join-Path $projectDir "build"
          $exe = Join-Path $buildDir "CityRun.exe"
          if (!(Test-Path $exe)) {
            Get-ChildItem -Path $projectDir -Recurse -File | Select-Object FullName,Length
            throw "CityRun.exe is missing after export: $exe"
          }
          New-Item -ItemType Directory -Force -Path "package" | Out-Null
          Copy-Item $exe "package\CityRun.exe" -Force
          $pck = Join-Path $buildDir "CityRun.pck"
          if (Test-Path $pck) {
            Copy-Item $pck "package\CityRun.pck" -Force
          } else {
            Write-Host "No separate PCK file found; checking whether the export is self-contained."
          }
          Compress-Archive -Path "package\*" -DestinationPath "CityRun-Windows.zip" -Force
          Get-ChildItem "package" | Format-Table Name,Length

      - uses: actions/upload-artifact@v5
        with:
          name: CityRun-Windows
          path: CityRun-Windows.zip
          if-no-files-found: error
