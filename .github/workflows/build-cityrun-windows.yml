name: Build City Run for Windows

on:
  push:
    branches: [gta5-one-mission]
    paths:
      - "gta5-one-mission/**"
      - ".github/workflows/build-cityrun-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz -DestinationPath templates
      - name: Install export templates
        shell: pwsh
        run: |
          $templateDir = "$env:APPDATA\Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item "templates\templates\*" $templateDir -Recurse -Force
          if (!(Test-Path (Join-Path $templateDir "windows_release_x86_64.exe"))) {
            Get-ChildItem $templateDir -Recurse | Select-Object FullName
            throw "Godot Windows release export template was not installed"
          }
      - name: Import and validate project
        shell: pwsh
        run: |
          & "godot\Godot_v4.3-stable_win64.exe" --headless --editor --path "gta5-one-mission" --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export Windows game
        shell: pwsh
        run: |
          $buildDir = Join-Path $PWD "gta5-one-mission\build"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          $output = Join-Path $buildDir "CityRun.exe"
          & "godot\Godot_v4.3-stable_win64.exe" --headless --path "gta5-one-mission" --export-release "Windows Desktop" "$output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $output)) {
            Get-ChildItem -Path "gta5-one-mission" -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Godot export completed without creating $output"
          }
          Write-Host "Exported executable: $output"
      - name: Package game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $exe = "gta5-one-mission\build\CityRun.exe"
          if (!(Test-Path $exe)) { throw "CityRun.exe is missing: $exe" }
          Copy-Item $exe package\CityRun.exe
          $pck = "gta5-one-mission\build\CityRun.pck"
          if (Test-Path $pck) { Copy-Item $pck package\CityRun.pck }
          Compress-Archive -Path "package\*" -DestinationPath "CityRun-Windows.zip" -Force
          Get-ChildItem package | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: CityRun-Windows
          path: CityRun-Windows.zip
          if-no-files-found: error
